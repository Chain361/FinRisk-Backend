name: Log retention

on:
  workflow_dispatch:
  schedule:
    # 18:30 UTC = 01:30 Asia/Bangkok. Scheduled workflows run from the default branch.
    - cron: "30 18 * * *"

jobs:
  access-log-retention:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Check required secret
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret is required for log retention." >&2
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run access-log retention
        run: python scripts/run_log_retention.py --triggered-by github-actions
